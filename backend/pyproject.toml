[project]
name = "docbrain-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "boto3>=1.43.56",
    "email-validator>=2.3.0",
    "fastapi>=0.139.2",
    "google-genai>=1.9.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.1.1",
    "python-docx>=1.2.0",
    "python-jose>=3.5.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.56",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "reportlab>=4.4.4",
    "ruff>=0.15.22",
    "types-openpyxl>=3.1.5.20250919",
    "types-reportlab>=4.4.4.20250809",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient nudges toward httpx2; httpx is already a dev
    # dependency here and works fine, so this is noise on every run.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
